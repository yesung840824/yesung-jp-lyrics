<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YESUNG LIVE TOUR「咲き誇る時を待つのは」</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YESUNG">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:        #f4efe6;
  --bg2:       #ece6da;
  --paper:     #faf7f2;
  --ink:       #2c2318;
  --ink2:      #5c5044;
  --ink3:      #9a8e7e;
  --sepia:     #8c6d3f;
  --sepia-lt:  #c4a06a;
  --sepia-bg:  #f0e4cc;
  --accent:    #6b4c2a;
  --romaji-c:  #5a7a5a;
  --kuudoku-c: #7a5a8a;
  --active-bg: #e8dcc8;
  --active-bdr:#8c6d3f;
  --border:    rgba(140,109,63,0.2);
  --border2:   rgba(140,109,63,0.1);
  --sprocket:  rgba(140,109,63,0.25);
  --sidebar-w: 240px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
}

.site-wrap {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* TOP HEADER BAR */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px 0 0;
  z-index: 200;
  box-shadow: 0 1px 6px rgba(140,109,63,0.08);
}

.top-bar-toggle {
  flex-shrink: 0;
  width: 40px;
  height: 56px;
  border: none;
  background: transparent;
  color: var(--ink2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  padding: 0 8px 0 12px;
}

.top-bar-toggle:hover { background: var(--sepia-bg); }

.top-bar-logo {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  opacity: 0.92;
}

.top-bar-title {
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  text-align: center;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.top-bar-sub {
  font-size: 10px;
  color: var(--ink3);
  font-family: 'Noto Sans TC', sans-serif;
  white-space: nowrap;
}

/* BODY BELOW HEADER */
.body-wrap {
  display: flex;
  flex: 1;
  margin-top: 56px;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--paper);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 56px; left: 0;
  height: calc(100vh - 56px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}

.sidebar.collapsed {
  transform: translateX(calc(-1 * var(--sidebar-w)));
}

.track-list { padding: 6px 0; flex: 1; }

.track-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.18s, border-color 0.18s;
}

.track-item:hover { background: rgba(140,109,63,0.12); }
.track-item.active {
  background: linear-gradient(90deg, rgba(140,109,63,0.18) 0%, rgba(140,109,63,0.06) 100%);
  border-left: 4px solid var(--sepia);
}


.track-num {
  font-size: 9px;
  color: var(--ink3);
  font-family: 'Noto Sans TC', sans-serif;
  margin-top: 2px;
  flex-shrink: 0;
  width: 16px;
}

.track-item.active .track-num { color: var(--sepia); }
.track-info { flex: 1; min-width: 0; }

.track-title-ja {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 3px;
  word-break: break-all;
}

.track-item.active .track-title-ja { color: var(--accent); }

.track-title-zh {
  font-size: 10px;
  color: var(--ink3);
  font-family: 'Noto Sans TC', sans-serif;
  line-height: 1.3;
}

/* MAIN */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  margin-left: var(--sidebar-w);
  transition: margin-left 0.28s cubic-bezier(0.4,0,0.2,1);
}

.main.expanded { margin-left: 0; }

/* SONG HEADER */
.song-header {
  background: var(--paper);
  border-bottom: 1px solid var(--border2);
}

.song-header-inner {
  padding: 18px 56px 14px 28px;
}

.frame-no { display: none; }

.song-title {
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 4px;
}

.song-sub {
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.1em;
  font-family: 'Noto Sans TC', sans-serif;
}

/* PLAYER */
.player-wrap {
  background: transparent;
}

.yt-wrap {
  padding: 0;
  background: transparent;
}

.yt-frame {
  position: relative;
  width: 100%;
  max-width: 100%;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
}

.yt-frame iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: none;
}



/* TOGGLE BAR */
.toggle-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
  padding: 9px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.toggle-label {
  font-size: 10px;
  color: var(--ink3);
  letter-spacing: 0.15em;
  font-family: 'Noto Sans TC', sans-serif;
  margin-right: 4px;
}

.toggle-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--paper);
  cursor: pointer;
  font-size: 11px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink2);
  transition: all 0.2s;
  user-select: none;
}

.toggle-chip:hover { border-color: var(--sepia-lt); }
.toggle-chip.romaji  { --chip-c: var(--romaji-c); }
.toggle-chip.kuudoku { --chip-c: var(--kuudoku-c); }
.toggle-chip.on { background: var(--chip-c); border-color: var(--chip-c); color: #fff; }

.chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.7;
}

/* LYRICS */
.lyrics-wrap {
  background: var(--paper);
  border: 1px solid var(--border2);
  margin: 16px 16px 48px;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 1px 8px rgba(140,109,63,0.07);
}

.lyric-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 14px;
  border-left: 3px solid transparent;
  transition: background 0.25s, border-color 0.25s, opacity 0.3s;
  cursor: pointer;
}

.lyric-row:hover { background: var(--sepia-bg); }
.lyric-row.active {
  background: linear-gradient(90deg, rgba(140,109,63,0.13) 0%, rgba(140,109,63,0.03) 100%);
  border-left: 4px solid var(--active-bdr);
  animation: pulse-row 2.4s ease-in-out infinite;
}
.lyric-row.passed { opacity: 0.38; }

@keyframes pulse-row {
  0%, 100% { border-left-color: var(--active-bdr); }
  50%       { border-left-color: var(--sepia-lt); }
}

.divider { height: 1px; background: var(--border2); margin: 0 16px; }

.time-btn {
  flex-shrink: 0;
  align-self: center;
  width: 42px;
  height: 22px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--sepia);
  font-size: 9px;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  transition: all 0.2s;
}

.time-btn:hover { background: var(--sepia-bg); border-color: var(--sepia-lt); }
.lyric-row.active .time-btn { background: var(--sepia); border-color: var(--sepia); color: #fff; }

.lyric-texts { flex: 1; min-width: 0; }

.lyric-ja {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.8;
  margin-bottom: 2px;
}

.lyric-row.active .lyric-ja { color: var(--accent); font-weight: 500; }

ruby rt {
  font-size: 9px;
  color: var(--ink3);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500;
}

.lyric-row.active ruby rt { color: var(--sepia); }

.lyric-romaji {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--romaji-c);
  line-height: 1.6;
  margin-bottom: 2px;
  display: none;
}

.lyric-kuudoku {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--kuudoku-c);
  line-height: 1.6;
  font-weight: 400;
  margin-bottom: 2px;
  display: none;
}

.lyric-zh {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--ink3);
  line-height: 1.6;
  font-weight: 400;
}

.lyric-row.active .lyric-zh { color: var(--ink2); }

.pp-btn {
  flex-shrink: 0;
  align-self: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--sepia-lt);
  background: transparent;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  padding: 0;
  line-height: 0;
}

.lyric-row.active .pp-btn { display: flex; }
.pp-btn:hover { background: var(--sepia-bg); border-color: var(--sepia); }
.pp-btn:active { transform: scale(0.91); }
.pp-btn svg { display: block; pointer-events: none; }

.copyright-footer {
  text-align: center;
  padding: 20px 16px 32px;
  margin: 0 16px;
  border-top: 1px solid var(--border2);
}

.copyright-footer p {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  color: var(--ink3);
  line-height: 1.8;
  opacity: 0.7;
}

body.show-romaji  .lyric-romaji  { display: block; }
body.show-kuudoku .lyric-kuudoku { display: block; }

@media (max-width: 600px) {
  :root { --sidebar-w: 130px; }
  .song-title { font-size: 15px; }
  .song-header-inner { padding: 14px 16px 12px; }
  .lyrics-wrap { margin: 10px 8px 40px; }
  .lyric-ja { font-size: 14px; }
  .track-title-ja { font-size: 10px; }
}
</style>
</head>

const ICON_PLAY  = `<svg width="9" height="11" viewBox="0 0 11 13" fill="none" style="transform:translateX(1px)"><path d="M1 1L10 6.5L1 12V1Z" fill="#8c6d3f" stroke="#8c6d3f" stroke-width="0.8" stroke-linejoin="round"/></svg>`;
const ICON_PAUSE = `<svg width="9" height="11" viewBox="0 0 11 13" fill="none"><rect x="0.5" y="0.5" width="3.2" height="12" rx="1" fill="#8c6d3f"/><rect x="6.8" y="0.5" width="3.2" height="12" rx="1" fill="#8c6d3f"/></svg>`;

function fmt(s) {
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

let currentTrackIdx = 0;
let player = null;
let playerReady = false;
let duration = 0;
let raf = null;
let activeIdx = -1;
let isPlaying = false;

// Build sidebar
const trackListEl = document.getElementById('trackList');
tracks.forEach((tr, i) => {
  const item = document.createElement('div');
  item.className = 'track-item' + (i === 0 ? ' active' : '');
  item.innerHTML = `
    <div class="track-num">${tr.no}</div>
    <div class="track-info">
      <div class="track-title-ja">${tr.titleJa}</div>
      <div class="track-title-zh">${tr.titleZh}</div>
    </div>
  `;
  item.addEventListener('click', () => loadTrack(i));
  trackListEl.appendChild(item);
});

function buildLyrics(idx) {
  const container = document.getElementById('lyricsContainer');
  container.innerHTML = '';
  activeIdx = -1;
  tracks[idx].lyrics.forEach((line, i) => {
    const row = document.createElement('div');
    row.className = 'lyric-row';
    row.dataset.time = line.t;
    row.innerHTML = `
      <button class="time-btn">${fmt(line.t)}</button>
      <div class="lyric-texts">
        <div class="lyric-ja">${line.ja}</div>
        <div class="lyric-romaji">${line.romaji}</div>
        <div class="lyric-kuudoku">${line.kuudoku}</div>
        <div class="lyric-zh">${line.zh}</div>
      </div>
      <button class="pp-btn" title="播放">${ICON_PLAY}</button>
    `;
    row.querySelector('.time-btn').addEventListener('click', e => { e.stopPropagation(); seekTo(line.t); });
    row.querySelector('.pp-btn').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
    row.addEventListener('click', () => seekTo(line.t));
    container.appendChild(row);
    if (i < tracks[idx].lyrics.length - 1) {
      const d = document.createElement('div');
      d.className = 'divider';
      container.appendChild(d);
    }
  });
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('mainContent');
  sb.classList.toggle('collapsed');
  main.classList.toggle('expanded');
}

function loadTrack(idx) {
  currentTrackIdx = idx;
  const tr = tracks[idx];
  document.querySelectorAll('.track-item').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.getElementById('headerTrackNo').textContent = `Track ${tr.no}`;
  document.getElementById('headerTitle').textContent = tr.titleJa;
  document.getElementById('headerSub').textContent = tr.titleZh;
  duration = 0;
  isPlaying = false;
  updatePPBtn(false);
  stopTick();
  buildLyrics(idx);
  if (player && playerReady) {
    player.loadVideoById(tr.ytId);
  } else {
    document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${tr.ytId}?enablejsapi=1`;
  }
}

window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('ytPlayer', {
    events: {
      onReady(e) {
        playerReady = true;
        duration = e.target.getDuration();
        startTick();
      },
      onStateChange(e) {
        isPlaying = (e.data === 1);
        updatePPBtn(isPlaying);
        if (isPlaying) {
          if (!duration) { duration = player.getDuration(); }
          startTick();
        } else {
          stopTick();
        }
      }
    }
  });
};

function seekTo(sec) {
  if (player && player.seekTo) { player.seekTo(sec, true); player.playVideo(); }
}

function togglePlay() {
  if (!player) return;
  if (isPlaying) player.pauseVideo(); else player.playVideo();
}

function updatePPBtn(playing) {
  document.querySelectorAll('.pp-btn').forEach(btn => {
    btn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    btn.title = playing ? '暫停' : '播放';
  });
}

function startTick() {
  if (raf) cancelAnimationFrame(raf);
  (function tick() {
    if (!player || !player.getCurrentTime) return;
    const ct = player.getCurrentTime();
    if (duration) {
    }
    const lys = tracks[currentTrackIdx].lyrics;
    let ni = -1;
    for (let i = lys.length - 1; i >= 0; i--) { if (ct >= lys[i].t) { ni = i; break; } }
    if (ni !== activeIdx) {
      activeIdx = ni;
      document.querySelectorAll('.lyric-row').forEach((r, i) => {
        r.classList.remove('active','passed');
        if (i === ni) { r.classList.add('active'); r.scrollIntoView({ behavior:'smooth', block:'center' }); }
        else if (i < ni) r.classList.add('passed');
      });
    }
    raf = requestAnimationFrame(tick);
  })();
}

function stopTick() { if (raf) { cancelAnimationFrame(raf); raf = null; } }



const layerState = { romaji: false, kuudoku: false };
function toggleLayer(key) {
  layerState[key] = !layerState[key];
  document.body.classList.toggle('show-' + key, layerState[key]);
  document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1)).classList.toggle('on', layerState[key]);
}

loadTrack(0);
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
